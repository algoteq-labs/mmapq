name: Soak

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: Soak (run_soak)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MMAPQ_PUBLIC == 'true' }}
    steps:
      - name: Checkout mmapq (SHA under test)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ws/mmapq
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Build mktsim
        working-directory: ${{ github.workspace }}/ws/mmapq
        run: make mktsim
      - name: Run soak
        working-directory: ${{ github.workspace }}/ws/mmapq
        run: bash torture/mktsim/run_soak.sh "$RUNNER_TEMP/mktsim_soak"
      - name: Upload soak evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mktsim-soak-evidence
          path: ${{ runner.temp }}/mktsim_soak
          if-no-files-found: ignore
