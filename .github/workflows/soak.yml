name: Soak

on:
  # TEMP CI-01 soak measurement; removed before main
  push:
    branches:
      - 'ci-check/soak-measure'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: Soak (run_soak)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MMAPQ_PUBLIC == 'true' }}
    steps:
      - name: Checkout mmapq (SHA under test)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: ws/mmapq
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Build mktsim
        working-directory: ${{ github.workspace }}/ws/mmapq
        run: make mktsim
      - name: Run soak
        working-directory: ${{ github.workspace }}/ws/mmapq
        run: bash torture/mktsim/run_soak.sh "$RUNNER_TEMP/mktsim_soak"
      - name: Prune soak evidence (keep soak.log + failing runs)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/mktsim_soak"
          [ -d "$DIR" ] || exit 0
          fail_names="$(grep '^SOAKRUN ' "$DIR/soak.log" 2>/dev/null | grep -v 'result=PASS' | awk '{print $2}' | sort -u || true)"
          cd "$DIR"
          for entry in *; do
            [ "$entry" = "soak.log" ] && continue
            if [ -d "$entry" ] && printf '%s\n' "$fail_names" | grep -qx "$entry"; then
              continue
            fi
            rm -rf -- "$entry"
          done
      - name: Upload soak evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mktsim-soak-evidence
          path: ${{ runner.temp }}/mktsim_soak
          if-no-files-found: ignore
          retention-days: 14
