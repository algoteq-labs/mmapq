\* Bounds witness for cand54l_intent_na2_core (owner, 2026-10-25; an
\* EXPECTED check, FAIL 2, since 2026-10-27): a TLC violation of
\* WitnessSlowCommitCrossDelete
\* proves a slow commit past its pre-check on one lane can coexist with a
\* deleted payload file of the other lane at NA=2, NIdx=3, NPos=3 — i.e.
\* the core check's bounds exercise the cross-lane commit-vs-reclaim
\* interleaving.  An exhaustive PASS here would mean the bounds are too
\* tight: raise NPos to 4 in cand54l_intent_na2_core.cfg (and here) and
\* re-run this witness.
