\* CAND-54 L tier-1 guard at the minimal house bounds (NIdx=3,
\* NPos=3 — still two payload and two header files); the full
\* reduced-bounds runs are the non-core cand54l_* checks (tier 2).
SPECIFICATION Spec
CONSTANTS
  NA = 1
  NIdx = 3
  NPos = 3
  F = 2
  HF = 2
  MaxCrash = 1
  ArchFence = TRUE
  CommitFence = TRUE
  WaitAssumption = FALSE
  NaiveDelete = FALSE
  BoundedPass = FALSE
  AllowCrash = TRUE
  AllowUndo = TRUE
  AllowTimeout = TRUE
  ArbitraryCommit = FALSE
  ListingLivePass = TRUE
  AtomicDelete = FALSE
  PublishCAS = TRUE
  UndoRule = TRUE
  WaitPreCasOnly = FALSE
  IterateRefill = FALSE
  CommitIntent = TRUE
  ClearBeforeCAS = FALSE
  ScanBeforeIntents = FALSE
  ClearBeforeMin = FALSE
  JoinAtArchiveLine = FALSE
  MinSkipArchived = FALSE
  LineFloor = TRUE
INVARIANTS
  TypeOK
  NoLiveLoss
  NoOverwrite
  HeadersReferenceMessages
  NoDoubleCommit
  ArchiveLineMonotonic
  NoDeleteUnderPending
  SoLeLine
