\* CAND-49: the uncommitted iterator — IterateUncommitted refills pend[a]
\* from the lane's surviving uncommitted positions; crashes + archives
\* (incl. undo) + timeouts on, out-of-order commits intrinsic.  Invariants:
\* the crash-compatible set of cand35_crash_listing_cap (I1 is documented
\* as violable under crash — the CAND-35 defect record) + NoDoubleCommit +
\* ArchiveLineMonotonic + ArchiveLineNeverDecreases (D-G,
\* doc/design/archive-boundaries.md).
\* EXPECT: PASS (~2.5 h, full bounds; the --all tier)
SPECIFICATION Spec
CONSTANTS
  NA = 2
  NIdx = 3
  NPos = 3
  F = 2
  HF = 2
  MaxCrash = 1
  ArchFence = TRUE
  CommitFence = TRUE
  WaitAssumption = TRUE
  NaiveDelete = FALSE
  BoundedPass = FALSE
  AllowCrash = TRUE
  AllowUndo = TRUE
  AllowTimeout = TRUE
  ArbitraryCommit = FALSE
  ListingLivePass = TRUE
  AtomicDelete = TRUE
  PublishCAS = TRUE
  UndoRule = FALSE
  WaitPreCasOnly = FALSE
  IterateRefill = TRUE
  CommitIntent = FALSE
  ClearBeforeCAS = FALSE
  ScanBeforeIntents = FALSE
  ClearBeforeMin = FALSE
  JoinAtArchiveLine = FALSE
  MinSkipArchived = FALSE
  LineFloor = FALSE
INVARIANTS
  TypeOK
  NoLiveLoss
  NoOverwrite
  HeadersReferenceMessages
  NoDoubleCommit
  ArchiveLineMonotonic

PROPERTY
  ArchiveLineNeverDecreases
