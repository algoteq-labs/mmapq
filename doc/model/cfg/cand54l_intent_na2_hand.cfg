\* CAND-54 L, two lanes, hand-deleter variant of cand54l_intent_na2
\* (owner, 2026-10-25): same bounds (NA=2, NIdx=4, NPos=4) with
\* AtomicDelete = FALSE and UndoRule = TRUE — the hand-deletion rule in
\* place of the library reclaim.  Simulation-only tier (speed 3), same
\* rationale as cand54l_intent_na2 (see cfg/EXPECTED).
\* EXPECT: no violation found during the simulation window
SPECIFICATION Spec
CONSTANTS
  NA = 2
  NIdx = 4
  NPos = 4
  F = 2
  HF = 2
  MaxCrash = 1
  ArchFence = TRUE
  CommitFence = TRUE
  WaitAssumption = FALSE
  NaiveDelete = FALSE
  BoundedPass = FALSE
  AllowCrash = TRUE
  AllowUndo = TRUE
  AllowTimeout = TRUE
  ArbitraryCommit = FALSE
  ListingLivePass = TRUE
  AtomicDelete = FALSE
  PublishCAS = TRUE
  UndoRule = TRUE
  WaitPreCasOnly = FALSE
  IterateRefill = FALSE
  CommitIntent = TRUE
  ClearBeforeCAS = FALSE
  ScanBeforeIntents = FALSE
  ClearBeforeMin = FALSE
  JoinAtArchiveLine = FALSE
  MinSkipArchived = FALSE
  LineFloor = TRUE
INVARIANTS
  TypeOK
  NoLiveLoss
  NoOverwrite
  HeadersReferenceMessages
  NoDoubleCommit
  ArchiveLineMonotonic
  NoDeleteUnderPending
  SoLeLine
