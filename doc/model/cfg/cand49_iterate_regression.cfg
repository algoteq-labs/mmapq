\* CAND-49 D-G regression guard (speed 1, ~3 min on 13 cores): refill on,
\* crash on, NoDoubleCommit + ArchiveLineMonotonic +
\* ArchiveLineNeverDecreases.  Reduced bounds
\* (NA=1; NIdx=4/NPos=4 keep two payload and two header files, so the
\* file-deletion dynamics survive) so the default tier re-checks D-G on
\* every model-touching commit; the class-2 cfgs (cand49_iterate,
\* cand49_iterate_i1) keep full bounds for --all.  Fail-first record:
\* FAILs NoDoubleCommit in 3 s on the pre-archive-line model (rollback
\* trace).  EXPECT: PASS
SPECIFICATION Spec
CONSTANTS
  NA = 1
  NIdx = 4
  NPos = 4
  F = 2
  HF = 2
  MaxCrash = 1
  ArchFence = TRUE
  CommitFence = TRUE
  WaitAssumption = TRUE
  NaiveDelete = FALSE
  BoundedPass = FALSE
  AllowCrash = TRUE
  AllowUndo = TRUE
  AllowTimeout = TRUE
  ArbitraryCommit = FALSE
  ListingLivePass = TRUE
  AtomicDelete = TRUE
  PublishCAS = TRUE
  UndoRule = FALSE
  WaitPreCasOnly = FALSE
  IterateRefill = TRUE
  CommitIntent = FALSE
  ClearBeforeCAS = FALSE
  ScanBeforeIntents = FALSE
  ClearBeforeMin = FALSE
  JoinAtArchiveLine = FALSE
  MinSkipArchived = FALSE
  LineFloor = FALSE
INVARIANTS
  TypeOK
  NoLiveLoss
  NoOverwrite
  HeadersReferenceMessages
  NoDoubleCommit
  ArchiveLineMonotonic

PROPERTY
  ArchiveLineNeverDecreases
