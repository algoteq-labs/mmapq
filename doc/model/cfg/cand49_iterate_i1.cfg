\* CAND-49: the iterator with the full invariant set incl. I1 — crashes
\* OFF (I1 is violable under crash by design, the CAND-35 record; this cfg
\* checks I1 over the flag/archive-line encoding).  Note: refill is inert
\* without crashes (nothing clears pend/flag), so its distinct-state count
\* equals the control's; refill is exercised by cand49_iterate and
\* cand49_iterate_regression.  ArchiveLineNeverDecreases rides along.
\* EXPECT: PASS (~30 min; the --all tier)
SPECIFICATION Spec
CONSTANTS
  NA = 2
  NIdx = 3
  NPos = 3
  F = 2
  HF = 2
  MaxCrash = 1
  ArchFence = TRUE
  CommitFence = TRUE
  WaitAssumption = TRUE
  NaiveDelete = FALSE
  BoundedPass = FALSE
  AllowCrash = FALSE
  AllowUndo = TRUE
  AllowTimeout = TRUE
  ArbitraryCommit = FALSE
  ListingLivePass = TRUE
  AtomicDelete = TRUE
  PublishCAS = TRUE
  UndoRule = FALSE
  WaitPreCasOnly = FALSE
  IterateRefill = TRUE
  CommitIntent = FALSE
  ClearBeforeCAS = FALSE
  ScanBeforeIntents = FALSE
  ClearBeforeMin = FALSE
  JoinAtArchiveLine = FALSE
  MinSkipArchived = FALSE
  LineFloor = FALSE
INVARIANTS
  TypeOK
  NoLiveLoss
  NoOverwrite
  HeadersReferenceMessages
  I1
  NoDoubleCommit
  ArchiveLineMonotonic

PROPERTY
  ArchiveLineNeverDecreases
